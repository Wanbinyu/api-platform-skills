openapi: 3.0.3
info:
  title: Toy Billing API
  version: 2.0.0
  description: >
    Risky "cleanup" PR — looks tidy, ships breaks. Use for breaking-change + deprecation samples.
servers:
  - url: https://api.example.com/v1
paths:
  /invoices:
    get:
      operationId: listInvoices
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            # removed void from enum — breaking for clients filtering void
            type: string
            enum: [draft, open, paid]
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createInvoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /invoices/{invoiceId}:
    get:
      operationId: getInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /invoices/{invoiceId}/pay:
    post:
      operationId: payInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayInvoiceRequest"
      responses:
        # 200 -> 202 — clients waiting on 200 may break
        "202":
          description: Payment accepted async
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResult"
        "402":
          description: Payment required / failed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    CreateInvoiceRequest:
      type: object
      # memo became required — breaking
      required: [customer_id, line_items, memo]
      properties:
        customer_id:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
        line_items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineItemInput"
        memo:
          type: string
          maxLength: 500
    LineItemInput:
      type: object
      required: [description, amount_cents, quantity]
      properties:
        description:
          type: string
        # renamed money field — semantic/breaking
        unit_amount:
          type: number
          description: dollars (was amount_cents integer)
        quantity:
          type: integer
          minimum: 1
    PayInvoiceRequest:
      type: object
      # idempotency_key now required — soft/hard depending on clients
      required: [payment_method_id, idempotency_key]
      properties:
        payment_method_id:
          type: string
        idempotency_key:
          type: string
          maxLength: 64
    InvoiceList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        next_cursor:
          type: string
          nullable: true
    Invoice:
      type: object
      # total_cents removed; total (float dollars) added
      # hosted_invoice_url removed
      required: [id, customer_id, status, total, currency, created_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, open, paid]
        total:
          type: number
        currency:
          type: string
        memo:
          type: string
        created_at:
          type: string
          format: date-time
        # accidental internal field
        collector_score:
          type: number
    PaymentResult:
      type: object
      required: [invoice_id, status, amount_cents]
      properties:
        invoice_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [succeeded, pending, failed]
        amount_cents:
          type: integer
        receipt_url:
          type: string
          format: uri
